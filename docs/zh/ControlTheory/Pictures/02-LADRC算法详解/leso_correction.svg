<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">三阶 LESO 的误差校正机制</title>
  <desc id="desc">测量输出 ym 与位置估计 z1 形成误差 e，误差经 l1、l2、l3 三路增益校正位置、速度和总扰动估计，实际限幅输入 u_app 进入速度估计方程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#52514e"/></marker>
    <style>
      .title{font:700 26px 'Microsoft YaHei',sans-serif;fill:#0b0b0b}.head{font:700 21px 'Microsoft YaHei',sans-serif;fill:#0b0b0b}.body{font:19px 'Microsoft YaHei',sans-serif;fill:#52514e}.math{font:20px 'Consolas','Microsoft YaHei',monospace;fill:#0b0b0b}.note{font:17px 'Microsoft YaHei',sans-serif;fill:#52514e}.arrow{stroke:#52514e;stroke-width:2;fill:none;marker-end:url(#arrow)}.row{fill:#ffffff;stroke:#e1e0d9;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fcfcfb"/>
  <text x="48" y="48" class="title">LESO 不知道扰动本身，只靠输出误差不断修正估计</text>

  <rect x="54" y="122" width="190" height="82" rx="12" fill="#f3f7fd" stroke="#2a78d6" stroke-width="2"/>
  <text x="82" y="156" class="head">测量输出 ym</text>
  <text x="82" y="184" class="note">包含真实 y 与噪声 n</text>
  <path d="M244 163 L308 163" class="arrow"/>

  <circle cx="340" cy="163" r="32" fill="#fff7f2" stroke="#eb6834" stroke-width="2"/>
  <text x="323" y="171" class="math">e</text>
  <text x="294" y="108" class="math">e = ym-z1</text>

  <rect x="432" y="92" width="500" height="408" rx="18" fill="#f5f4f0" stroke="#898781" stroke-width="2"/>
  <text x="460" y="132" class="head">三阶 LESO</text>
  <path d="M372 163 L408 163 L408 178 L460 178" class="arrow"/>
  <path d="M408 178 L408 288 L460 288" class="arrow"/>
  <path d="M408 288 L408 398 L460 398" class="arrow"/>

  <rect x="460" y="150" width="444" height="88" class="row" rx="10"/>
  <text x="482" y="184" class="math">ż1 = z2 + l1 e</text>
  <text x="482" y="216" class="note">校正位置估计 z1</text>

  <rect x="460" y="260" width="444" height="88" class="row" rx="10"/>
  <text x="482" y="294" class="math">ż2 = z3 + b0 u_app + l2 e</text>
  <text x="482" y="326" class="note">校正速度估计 z2</text>

  <rect x="460" y="370" width="444" height="88" class="row" rx="10"/>
  <text x="482" y="404" class="math">ż3 = l3 e</text>
  <text x="482" y="436" class="note">校正总扰动估计 z3</text>

  <rect x="80" y="382" width="212" height="76" rx="12" fill="#f1fbf6" stroke="#1baf7a" stroke-width="2"/>
  <text x="104" y="414" class="head">上一拍 u_app</text>
  <text x="104" y="442" class="note">实际限幅后的输入</text>
  <path d="M292 420 L432 420 L432 316 L460 316" class="arrow"/>

  <path d="M932 194 L1002 194" class="arrow"/>
  <path d="M932 304 L1002 304" class="arrow"/>
  <path d="M932 414 L1002 414" class="arrow"/>
  <text x="1018" y="188" class="math">z1</text>
  <text x="1018" y="214" class="note">位置</text>
  <text x="1018" y="298" class="math">z2</text>
  <text x="1018" y="324" class="note">速度</text>
  <text x="1018" y="408" class="math">z3</text>
  <text x="1018" y="434" class="note">总扰动</text>

  <rect x="166" y="544" width="868" height="58" rx="12" fill="#fff7f2" stroke="#eb6834"/>
  <text x="194" y="580" class="body">带宽越高，校正通常越快；噪声进入同一个误差 e，也会同步增强。</text>
</svg>
